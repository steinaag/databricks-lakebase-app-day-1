<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #1a202c;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hint {
      color: #718096;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
      padding: 16px;
      background: #f7fafc;
      border-left: 4px solid #667eea;
      border-radius: 4px;
    }

    form {
      background: #f8f9fa;
      padding: 32px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid #e2e8f0;
    }

    label {
      display: block;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      transition: all 0.3s ease;
      background: white;
      color: #2d3748;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      transform: translateY(-1px);
    }

    input[type="text"]::placeholder {
      color: #a0aec0;
    }

    button {
      margin-top: 20px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
    }

    #result {
      margin-top: 24px;
      padding: 18px 20px;
      background: #f7fafc;
      border-radius: 8px;
      border-left: 4px solid #48bb78;
      color: #2d3748;
      font-size: 15px;
      line-height: 1.6;
      min-height: 24px;
      animation: slideIn 0.3s ease;
    }

    #result:empty {
      display: none;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .table-container {
      margin-top: 40px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    th {
      padding: 16px 20px;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody tr {
      transition: all 0.2s ease;
      border-bottom: 1px solid #e2e8f0;
    }

    tbody tr:hover {
      background: #f7fafc;
      transform: scale(1.01);
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    td {
      padding: 16px 20px;
      color: #4a5568;
      font-size: 15px;
    }

    td:nth-child(1) {
      font-weight: 700;
      color: #667eea;
    }

    td:nth-child(3) {
      font-weight: 600;
      color: #48bb78;
    }

    @media (max-width: 768px) {
      .container {
        padding: 32px 24px;
      }

      h1 {
        font-size: 28px;
      }

      form {
        padding: 24px;
      }

      table {
        font-size: 14px;
      }

      th, td {
        padding: 12px 16px;
      }
    }

    .loading {
      border-left-color: #f6ad55 !important;
    }

    .error {
      border-left-color: #f56565 !important;
      background: #fff5f5 !important;
    }

    .delete-btn {
      background: #fc8181;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .delete-btn:hover {
      background: #f56565;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(245, 101, 101, 0.4);
    }

    .delete-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stock Watchlist</h1>
    <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

    <form id="stock-form">
      <label for="symbol">Ticker symbol</label>
      <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
      <button type="submit">Add to watchlist</button>
    </form>

    <div id="result"></div>

    <div class="table-container">
      <table id="watchlist-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Email</th>
            <th>Latest price</th>
            <th>Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="watchlist-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          resultEl.className = "error";
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? "$" + Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
        resultEl.className = "error";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";
      resultEl.className = "loading";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          resultEl.className = "error";
          return;
        }
        resultEl.textContent = "✓ Successfully added " + data.symbol + " at $" + Number(data.latest_price).toFixed(2);
        resultEl.className = "";
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
        resultEl.className = "error";
      }
    });

    // Handle delete button clicks using event delegation
    watchlistBody.addEventListener("click", async (e) => {
      if (e.target.classList.contains("delete-btn")) {
        const symbol = e.target.getAttribute("data-symbol");
        if (!confirm(`Are you sure you want to remove ${symbol} from your watchlist?`)) {
          return;
        }

        resultEl.textContent = `Removing ${symbol}...`;
        resultEl.className = "loading";

        try {
          const resp = await fetch(`/watchlist/${symbol}`, {
            method: "DELETE",
          });
          const data = await resp.json();
          if (!resp.ok) {
            resultEl.textContent = "Error: " + (data.error || resp.statusText);
            resultEl.className = "error";
            return;
          }
          resultEl.textContent = `✓ Successfully removed ${symbol} from watchlist`;
          resultEl.className = "";
          loadWatchlist();
        } catch (err) {
          resultEl.textContent = "Request failed: " + err;
          resultEl.className = "error";
        }
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
